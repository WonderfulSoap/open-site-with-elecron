name: Release

on:
  push:
    tags:
      - 'release/[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Bump package version
        run: npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version

      - name: Build Linux AppImage — x64
        run: |
          npx electron-builder --linux AppImage --x64 --publish never
          cd dist && zip OpenSiteWithElectron-${{ steps.version.outputs.VERSION }}-linux-x64.zip *.AppImage && rm *.AppImage

      - name: Build Linux AppImage — arm64
        run: |
          npx electron-builder --linux AppImage --arm64 --publish never
          cd dist && zip OpenSiteWithElectron-${{ steps.version.outputs.VERSION }}-linux-arm64.zip *.AppImage && rm *.AppImage

      - name: Build Linux AppImage — armv7l
        run: |
          npx electron-builder --linux AppImage --armv7l --publish never
          cd dist && zip OpenSiteWithElectron-${{ steps.version.outputs.VERSION }}-linux-armv7l.zip *.AppImage && rm *.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-windows-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^release/', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Bump package version
        run: npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version

      - name: Build Windows portable — x64
        shell: pwsh
        run: |
          npx electron-builder --win portable --x64 --publish never
          Compress-Archive -Path dist\OpenSiteWithElectron.exe -DestinationPath dist\OpenSiteWithElectron-${{ steps.version.outputs.VERSION }}-win-x64.zip
          Remove-Item dist\OpenSiteWithElectron.exe

      - name: Build Windows portable — ia32
        shell: pwsh
        run: |
          npx electron-builder --win portable --ia32 --publish never
          Compress-Archive -Path dist\OpenSiteWithElectron.exe -DestinationPath dist\OpenSiteWithElectron-${{ steps.version.outputs.VERSION }}-win-ia32.zip
          Remove-Item dist\OpenSiteWithElectron.exe

      - name: Build Windows portable — arm64
        shell: pwsh
        run: |
          npx electron-builder --win portable --arm64 --publish never
          Compress-Archive -Path dist\OpenSiteWithElectron.exe -DestinationPath dist\OpenSiteWithElectron-${{ steps.version.outputs.VERSION }}-win-arm64.zip
          Remove-Item dist\OpenSiteWithElectron.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist\*.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          files: artifacts/*
          generate_release_notes: true
